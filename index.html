<title>Turley Household</title>
<style>
  /* Design language
     ----------------
     The previous pass still wrapped every single element in a bordered box on a
     2-column grid, which is the 2010 dashboard look. Two rules replace that:

       1. Numbers float. A statistic gets no container at all — size, weight and
          whitespace carry the hierarchy. Boxing a number adds nothing.
       2. Only lists get a surface. Rows need something to sit in and be divided
          by, so they get one soft panel with NO border. Everything else is bare.

     Depth is surface lightness, never shadow — a black shadow on a dark ground
     only muddies the edge. Colour is reserved for meaning (up/down, income/spend);
     the interface itself is greyscale plus one accent. */
  :root {
    --bg: #0c1116;
    --panel: #161e27;           /* the one raised surface: grouped lists */
    --panel-2: #1d2732;         /* inputs, chips, nested rows */
    --hair: rgba(255,255,255,0.06);

    --text: #eef3f8;
    --muted: #8fa0b3;
    --faint: #64758a;

    --accent: #5b9bff;
    --accent-soft: rgba(91,155,255,0.15);
    --pos: #3ddb9a;
    --neg: #ff6b6b;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r-ctl: 12px; --r-panel: 18px; --r-pill: 999px;
    --float: 0 10px 30px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
    height: 100%; overscroll-behavior: none;
    /* Tabular figures everywhere: money columns must align, and digits must not
       jitter when a value changes. */
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  #app { display: none; flex-direction: column; height: 100vh; }
  #app.ready { display: flex; }

  /* No title. The app is the only thing on screen, so a name across the top was
     ~60px of vertical space spent restating what the user already knew. The refresh
     stamp is the one piece of actual data that lived up here, so it is what stays. */
  header { padding: var(--s4) var(--s5) var(--s2); max-width: 600px; margin: 0 auto; width: 100%; }
  header p { margin: 0; color: var(--faint); font-size: 12px; letter-spacing: -0.005em; }
  main { flex: 1; overflow-y: auto; padding: 0 var(--s5) 132px; -webkit-overflow-scrolling: touch; max-width: 600px; margin: 0 auto; width: 100%; }
  .page { display: none; }
  .page.active { display: block; }
  .subview { display: none; }
  .subview.active { display: block; }

  /* Section label: quiet, wide space above, no rule and no uppercase. The old
     version stacked uppercase + letterspacing + a coloured bar on a label that
     needs one signal. */
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: var(--s6) 0 var(--s3); letter-spacing: -0.005em; }

  /* --- The one surface --------------------------------------------------- */
  .card { background: var(--panel); border-radius: var(--r-panel); padding: var(--s2) var(--s4); }

  /* --- Statistics: no container ------------------------------------------ */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5) var(--s4); margin: var(--s2) 0 var(--s6); }
  .kpi-grid .card { background: none; border-radius: 0; padding: 0; }
  .kpi-label { color: var(--faint); font-size: 12px; font-weight: 500; letter-spacing: -0.005em; }
  .kpi-value { font-size: 22px; font-weight: 600; margin-top: 6px; letter-spacing: -0.025em; line-height: 1.1; }
  .kpi-value.negative { color: var(--neg); }
  .kpi-value.positive { color: var(--pos); }
  .kpi-value.is-text { font-size: 17px; letter-spacing: -0.01em; line-height: 1.25; }
  .kpi-sub { color: var(--faint); font-size: 11px; margin-top: 5px; letter-spacing: -0.005em; }

  /* The lead figure. Big/small contrast is the whole hierarchy — at 46px this
     reads before anything else on the screen, which is the point of a dashboard. */
  .kpi-hero { grid-column: 1 / -1; margin-bottom: var(--s2); }
  .kpi-hero .kpi-label { font-size: 13px; }
  .kpi-hero .kpi-value { font-size: 46px; font-weight: 600; letter-spacing: -0.035em; margin-top: var(--s2); }
  .kpi-hero .kpi-sub { font-size: 12px; margin-top: var(--s2); }
  .kpi-wide { grid-column: 1 / -1; }

  /* --- Rows --------------------------------------------------------------- */
  .cat-row, .txn-row, .spark-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--hair); }
  .cat-row:last-child, .txn-row:last-child, .spark-row:last-child { border-bottom: none; }
  .cat-row { font-size: 15px; }
  .cat-row .amt { font-weight: 600; white-space: nowrap; letter-spacing: -0.015em; }
  .cat-row .amt.negative { color: var(--neg); }
  .cat-row-link, .spark-row { cursor: pointer; }
  .cat-row-link:active, .spark-row:active, .txn-row:active { background: rgba(255,255,255,0.04); }
  .cat-row .chev { color: var(--faint); margin-left: var(--s2); font-weight: 400; }

  .txn-main { min-width: 0; }
  .txn-merchant { font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }
  .txn-meta { font-size: 12px; color: var(--faint); margin-top: 3px; }
  .txn-amount { font-weight: 600; font-size: 15px; white-space: nowrap; letter-spacing: -0.015em; }
  .txn-amount.negative { color: var(--neg); }
  .txn-amount.positive { color: var(--pos); }
  .txn-count { color: var(--faint); font-size: 12px; margin: 0 0 var(--s2) 2px; }

  .spark-main { flex: 1; min-width: 0; }
  .spark-name { font-size: 14px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; }
  .spark-total { font-size: 12px; color: var(--faint); margin-top: 3px; }
  .spark-svg { flex-shrink: 0; }
  .spark-delta { font-size: 12px; font-weight: 600; width: 40px; text-align: right; flex-shrink: 0; color: var(--faint); }
  .spark-delta.up { color: var(--neg); }
  .spark-delta.down { color: var(--pos); }

  /* --- Goals -------------------------------------------------------------- */
  .goal-card { background: none; padding: 0; margin-bottom: var(--s5); }
  .goal-card .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--s3); gap: var(--s2); }
  .goal-card .name { font-weight: 600; font-size: 16px; letter-spacing: -0.015em; }
  .goal-card .amounts { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .bar-track { background: rgba(255,255,255,0.07); border-radius: var(--r-pill); height: 5px; overflow: hidden; position: relative; }
  /* Budget bars only: the fill can now run PAST the target, so the track cannot
     clip. The fill carries its own radius, so dropping overflow costs nothing. */
  .bar-track.with-target { overflow: visible; }
  /* Where the target sits on the scale. A reference mark rather than a status,
     so it stays greyscale - colour is reserved for meaning. It overhangs the 5px
     track top and bottom so it still reads against a filled bar. */
  .bar-target { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px;
                background: var(--text); border-radius: 1px; }
  .bar-fill { background: var(--accent); height: 100%; border-radius: var(--r-pill); transition: width 0.5s cubic-bezier(0.2,0.8,0.2,1); }
  /* Colour carries meaning only: a bar goes red when the budget is missed, which
     is over target for spending and UNDER target for savings. */
  .bar-fill.bad { background: var(--neg); }
  .bar-fill.good { background: var(--pos); }
  .goal-note { font-size: 12px; color: var(--faint); margin-top: var(--s2); }

  /* --- Pooled savings ----------------------------------------------------- */
  .pooled-card p { display: flex; justify-content: space-between; margin: 0; padding: var(--s3) 0; font-size: 15px; border-bottom: 1px solid var(--hair); }
  .pooled-card p:last-of-type { border-bottom: none; }
  .pooled-card .label { color: var(--muted); }
  .reconcile { margin: var(--s2) 0 var(--s3); padding: var(--s3); border-radius: var(--r-ctl); background: var(--panel-2); font-size: 13px; color: var(--muted); }

  /* --- Charts ------------------------------------------------------------- */
  .chart-card { padding: var(--s4); margin-bottom: var(--s3); }
  .chart-title { font-size: 16px; font-weight: 600; margin: 0 0 3px; letter-spacing: -0.015em; }
  .chart-note { font-size: 11px; color: var(--faint); margin: 0 0 var(--s3); line-height: 1.5; }
  .legend { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s3); }
  .legend span { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faint); }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .bar-seg { cursor: pointer; }

  /* --- Controls ----------------------------------------------------------- */
  .seg { display: flex; gap: var(--s2); margin: var(--s2) 0 var(--s5); }
  .seg button { padding: 13px var(--s5); border: none; background: var(--panel); color: var(--muted); border-radius: var(--r-pill); font-size: 14px; font-weight: 500; letter-spacing: -0.01em; transition: background 0.18s ease, color 0.18s ease; }
  .seg button.active { background: var(--text); color: var(--bg); font-weight: 600; }

  .field label { display: block; font-size: 12px; color: var(--faint); margin-bottom: var(--s2); font-weight: 500; }
  .field input, .month-select, .txn-filters select {
    width: 100%; padding: 14px var(--s4); border-radius: var(--r-ctl);
    border: 1px solid transparent; background: var(--panel); color: var(--text);
    font-size: 16px; letter-spacing: -0.01em; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input::placeholder { color: var(--faint); }
  .field input:focus, .month-select:focus, .txn-filters select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .month-select { margin-bottom: var(--s5); font-weight: 600; }
  .txn-filters { display: flex; flex-direction: column; gap: var(--s3); margin-bottom: var(--s5); }
  /* Collapsed by default: the three filter rows cost roughly 380px before you
     reach the list, and most visits to History never touch them. */
  .filter-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: var(--s3); background: var(--panel); border: none; border-radius: var(--r-ctl);
    padding: 13px var(--s4); color: var(--muted); font-size: 14px; font-weight: 500;
    letter-spacing: -0.01em; text-align: left; min-height: 48px; margin-bottom: var(--s4);
  }
  .filter-toggle .label { min-width: 0; }
  .filter-toggle .chev { color: var(--faint); flex-shrink: 0; transition: transform 0.18s ease; }
  .filter-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
  /* Accent when something is actually filtering, so a collapsed panel can never
     hide the fact that the list is not showing everything. */
  .filter-toggle.filtered .label { color: var(--accent); }
  .txn-filters .row { display: flex; gap: var(--s3); }
  .txn-filters .row .field { flex: 1; margin: 0; }
  /* Text buttons still need a 44px target even though they carry no fill. */
  .txn-clear, .back-btn { background: none; border: none; color: var(--accent); font-weight: 500; letter-spacing: -0.01em; display: inline-flex; align-items: center; min-height: 44px; padding: 0; align-self: flex-start; }
  .txn-clear { font-size: 14px; }
  .back-btn { font-size: 15px; }
  /* The principal/interest split is the reason this section exists -- Trevon kept the
     payment as ONE row and asked for the split shown clearly, so it is not a footnote. */
  .split { display: flex; gap: var(--s2); align-items: baseline; flex-wrap: wrap;
           margin-top: var(--s3); font-size: 13px; }
  .split .to-debt { color: var(--pos); font-weight: 600; }
  .split .to-interest { color: var(--neg); font-weight: 600; }
  .split .sep { color: var(--faint); }
  .payoff-note { font-size: 12px; color: var(--faint); margin-top: var(--s2); }
  .payoff-win { font-size: 13px; color: var(--accent); font-weight: 500; margin-top: var(--s2); }
  /* ONE rule for the hidden attribute, because two separate elements have already
     been caught by the same trap: a display: rule on the element beats a bare
     [hidden], so the attribute silently stops working. This settles it everywhere. */
  [hidden] { display: none !important; }
  .check-row { display: flex; align-items: center; gap: var(--s2); min-height: 44px; }
  .check-row input { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
  .check-row label { font-size: 13px; color: var(--muted); }


  /* --- Floating layers ---------------------------------------------------- */
  .toast { position: fixed; bottom: 116px; left: var(--s5); right: var(--s5); max-width: 540px; margin: 0 auto; background: var(--panel-2); border-radius: var(--r-ctl); padding: 14px var(--s4); text-align: center; font-size: 14px; box-shadow: var(--float); display: none; z-index: 20; }
  .toast.show { display: block; }
  .toast.error { color: var(--neg); }
  .toast.ok { color: var(--pos); }
  /* colour is set per-bar from JS -- it is what tells you which series you are
     reading now that the series name is no longer spelled out. 600 not 500: a
     coloured 12px string on a dark panel needs the weight to stay crisp. */
  .chart-tooltip { position: fixed; pointer-events: none; background: var(--panel-2); color: var(--text); font-size: 12px; font-weight: 600; padding: var(--s2) var(--s3); border-radius: var(--r-ctl); box-shadow: var(--float); white-space: nowrap; display: none; z-index: 50; }
  .chart-tooltip.show { display: block; }

  /* --- Navigation --------------------------------------------------------- */
  /* Four destinations, not six. Adding a transaction is an action, not a place,
     so it becomes the floating button instead of competing for a tab slot. */
  nav { display: flex; gap: var(--s1); background: rgba(12,17,22,0.82); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-top: 1px solid var(--hair); padding: var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom)); position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: 0 auto; z-index: 15; }
  nav button { flex: 1; background: none; border: none; color: var(--faint); font-size: 11px; font-weight: 500; padding: var(--s2) 2px var(--s1); border-radius: var(--r-ctl); display: flex; flex-direction: column; align-items: center; gap: 5px; letter-spacing: -0.005em; transition: color 0.18s ease; }
  nav button .icon { display: flex; }
  nav button .icon svg { width: 23px; height: 23px; }
  nav button.active { color: var(--text); }

  .loading { text-align: center; color: var(--faint); padding: var(--s7) 0; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* --- Passphrase gate ---------------------------------------------------- */
  #gate { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: var(--s5); text-align: center; }
  #gate.hidden { display: none; }
  #gate h1 { font-size: 26px; font-weight: 600; margin: 0 0 var(--s2); letter-spacing: -0.025em; }
  #gate p { color: var(--muted); font-size: 14px; margin: 0 0 var(--s6); }
  #gate input { width: 100%; max-width: 300px; padding: 14px var(--s4); border-radius: var(--r-ctl); border: 1px solid transparent; background: var(--panel); color: var(--text); font-size: 16px; text-align: center; margin-bottom: var(--s3); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  #gate input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #gate button { width: 100%; max-width: 300px; padding: 15px; border-radius: var(--r-pill); border: none; background: var(--accent); color: #06101f; font-weight: 600; font-size: 16px; transition: transform 0.12s ease; }
  #gate button:active { transform: scale(0.98); }
  #gate .gate-error { color: var(--neg); font-size: 13px; margin-top: var(--s3); min-height: 16px; }
</style>
</head>
<body>

<div id="gate">
  <h1>Turley Household</h1>
  <p>Enter the app passphrase to continue.</p>
  <input type="password" id="gate-input" placeholder="Passphrase" autocomplete="off">
  <button type="button" id="gate-submit">Unlock</button>
  <div class="gate-error" id="gate-error"></div>
</div>

<div id="app">
  <header>
    <p id="lastUpdated">Loading…</p>
  </header>
  <main>
    <section id="page-dashboard" class="page active">
      <div class="kpi-grid" id="kpiGrid"><div class="loading">Loading dashboard…</div></div>
      <div class="section-title">Pooled Savings</div>
      <div class="card pooled-card" id="pooledCard"></div>
    </section>

    <!-- "What happened in July" and "what's the trend" are two views of the same
         question, so they share one destination rather than two nav slots. -->
    <section id="page-spending" class="page">
      <div class="seg" id="spendView">
        <button type="button" data-value="month" class="active">This month</button>
        <button type="button" data-value="trends">Over time</button>
      </div>

      <div class="subview active" id="spendMonth">
        <select class="month-select" id="summaryMonth"></select>
        <div class="kpi-grid" id="summaryKpiGrid"></div>
        <div class="section-title">Transfers and debt</div>
        <div class="card" id="summaryDebtCard"></div>
        <div class="section-title">Spending by category</div>
        <div class="card" id="summaryCats"></div>
      </div>

      <div class="subview" id="spendTrends">
        <div id="trendsBody"><div class="loading">Loading trends…</div></div>
      </div>
    </section>

    <!-- Budgets and savings goals answer the same question — are we on track —
         and already share a visual language, so they share a page. Budgets are
         the monthly half, goals the long-run half. -->
    <section id="page-goals" class="page">
      <div class="section-title">Budget</div>
      <div class="chart-note" id="budgetMonthNote"></div>
      <div class="seg" id="personFilter" style="display:none"></div>
      <div id="budgetList"><div class="loading">Loading budgets…</div></div>
      <div class="section-title">Savings goals</div>
      <div id="goalsList"><div class="loading">Loading goals…</div></div>
      <!-- Hidden until a loan actually exists, so an empty Loans tab leaves no
           orphan heading behind. -->
      <div class="section-title" id="debtTitle" hidden>Debt payoff</div>
      <div id="debtList" hidden></div>
    </section>

    <section id="page-transactions" class="page">
      <button type="button" class="back-btn" id="tf-back" hidden></button>
      <div class="section-title">Transactions</div>
      <button type="button" class="filter-toggle" id="tf-toggle" aria-expanded="false" aria-controls="tf-panel">
        <span class="label" id="tf-summary">Filters</span>
        <span class="chev">›</span>
      </button>
      <div class="txn-filters" id="tf-panel" hidden>
        <div class="row">
          <div class="field">
            <label for="tf-from">From</label>
            <input type="date" id="tf-from">
          </div>
          <div class="field">
            <label for="tf-to">To</label>
            <input type="date" id="tf-to">
          </div>
        </div>
        <div class="field">
          <label for="tf-month">Month</label>
          <select id="tf-month"><option value="">Year to date</option></select>
        </div>
        <div class="field">
          <label for="tf-category">Category</label>
          <select id="tf-category"><option value="">All Categories</option></select>
        </div>
        <div class="field">
          <label for="tf-sort">Sort by</label>
          <select id="tf-sort">
            <option value="date">Date, newest first</option>
            <option value="amount">Amount, largest first</option>
          </select>
        </div>
        <div class="check-row">
          <input type="checkbox" id="tf-transfers">
          <label for="tf-transfers">Show card payments (transfers between our own accounts)</label>
        </div>
        <button type="button" class="txn-clear" id="tf-clear">Clear Filters</button>
      </div>
      <div id="txnChart"></div>
      <div class="txn-count" id="txnCount"></div>
      <div class="card" id="txnList"><div class="loading">Loading transactions…</div></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <div class="chart-tooltip" id="chartTooltip"></div>
  <nav>
    <button class="nav-btn active" data-page="dashboard"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l9-6.5 9 6.5"/><path d="M5 10.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9.5"/></svg></span>Home</button>
    <button class="nav-btn" data-page="spending"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="21" x2="5" y2="13"/><line x1="12" y1="21" x2="12" y2="4"/><line x1="19" y1="21" x2="19" y2="9"/></svg></span>Spending</button>
    <button class="nav-btn" data-page="goals"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg></span>Goals</button>
    <button class="nav-btn" data-page="transactions"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6.5" x2="20" y2="6.5"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="17.5" x2="20" y2="17.5"/><circle cx="4.5" cy="6.5" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="17.5" r="1.2"/></svg></span>History</button>
  </nav>
</div>

<script>
  var API_URL = 'https://script.google.com/macros/s/AKfycbyLQlKJ44WRm8Zc0ctkj1K3lqpghG0s0wKRkeEbKEaYI--igmSFpfxjw3-GcA42vG4X1Q/exec';
  var PASS_KEY = 'turley_pass';

  function $(sel) { return document.querySelector(sel); }
  function $all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  function fmtMoney(n) {
    if (n === '' || n === null || n === undefined) return '--';
    var num = Number(n);
    var sign = num < 0 ? '-' : '';
    return sign + '$' + Math.abs(num).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0});
  }

  // Whole dollars everywhere else, but the loan split needs cents: rounded, a
  // $158.91 payment reads as "$107 + $52", which is $159, and a total that visibly
  // fails to add up is worse than no total. These are the bank's own figures and
  // should be checkable against the statement to the penny.
  function fmtMoneyCents(n) {
    if (n === '' || n === null || n === undefined) return '--';
    var num = Number(n);
    return (num < 0 ? '-' : '') + '$' +
      Math.abs(num).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtShort(n) {
    var a = Math.abs(Number(n) || 0);
    var sign = n < 0 ? '-' : '';
    if (a >= 1000) return sign + '$' + (a / 1000).toFixed(a >= 10000 ? 0 : 1) + 'k';
    return sign + '$' + a.toFixed(0);
  }

  function attrEscape(s) { return String(s).replace(/"/g, '&quot;'); }

  function apiGet(action, params) {
    var pass = localStorage.getItem(PASS_KEY);
    var qs = 'action=' + encodeURIComponent(action) + '&pass=' + encodeURIComponent(pass);
    for (var key in params) {
      if (params[key] !== undefined && params[key] !== null) {
        qs += '&' + key + '=' + encodeURIComponent(params[key]);
      }
    }
    return fetch(API_URL + '?' + qs).then(function(r) { return r.json(); });
  }
  // --- Passphrase gate ---
  function showGate(errorMsg) {
    $('#gate').classList.remove('hidden');
    $('#app').classList.remove('ready');
    $('#gate-error').textContent = errorMsg || '';
  }

  function tryUnlock(pass) {
    localStorage.setItem(PASS_KEY, pass);
    apiGet('dashboard').then(function(data) {
      if (data.error) {
        localStorage.removeItem(PASS_KEY);
        showGate('Incorrect passphrase. Try again.');
        return;
      }
      $('#gate').classList.add('hidden');
      $('#app').classList.add('ready');
      initApp();
    }).catch(function() {
      localStorage.removeItem(PASS_KEY);
      showGate('Could not reach the server. Try again.');
    });
  }

  $('#gate-submit').addEventListener('click', function() {
    var pass = $('#gate-input').value.trim();
    if (!pass) return;
    tryUnlock(pass);
  });
  $('#gate-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') $('#gate-submit').click();
  });

  // --- Charts (hand-rolled SVG — no library, so the page stays self-contained) ---
  var COLORS = { income: '#34d399', spend: '#f87171', checking: '#4f8ef7', credit: '#fbbf24', savings: '#a78bfa' };
  // Every category row is one colour. Once each category has its own chart the
  // hue carries no information — the name is right next to it — so six hues was
  // just noise. Colour is spent on the one thing that means something here: the
  // change column, red for spending up and green for down.
  var SPARK_COLOR = '#4f8ef7';
  var AXIS_TEXT = '#6d7f93';
  var GRID_LINE = 'rgba(255,255,255,0.07)';
  var ZERO_LINE = 'rgba(255,255,255,0.20)';

  function chartFrame(W, H, padL, padT, plotW, plotH, maxV, minV, labels) {
    var span = (maxV - minV) || 1;
    var y = function(v) { return padT + plotH * (maxV - v) / span; };
    var parts = [];
    // When a chart crosses zero, label the zero line itself — a midpoint label
    // lands next to the baseline and reads as if the baseline were that value.
    var ticks = minV < 0 ? [maxV, 0, minV] : [maxV, (maxV + minV) / 2, minV];
    ticks.forEach(function(v) {
      var yy = y(v);
      parts.push('<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (W - 6) + '" y2="' + yy.toFixed(1) +
        '" stroke="' + GRID_LINE + '" stroke-width="1"/>');
      parts.push('<text x="' + (padL - 6) + '" y="' + (yy + 3.5).toFixed(1) +
        '" text-anchor="end" font-size="9" fill="' + AXIS_TEXT + '">' + fmtShort(v) + '</text>');
    });
    return { y: y, parts: parts };
  }

  function xLabels(labels, padL, plotW, H, everyN) {
    var step = plotW / labels.length;
    return labels.map(function(lab, i) {
      if (everyN > 1 && i % everyN !== 0 && i !== labels.length - 1) return '';
      return '<text x="' + (padL + step * i + step / 2).toFixed(1) + '" y="' + (H - 7) +
        '" text-anchor="middle" font-size="9" fill="' + AXIS_TEXT + '">' + lab + '</text>';
    }).join('');
  }

  function buildBarChart(labels, series, opts) {
    opts = opts || {};
    // opts.tipLabels lets a chart put one thing on the axis and another in the
    // tooltip. The daily History chart needs it: the axis has room for "3", but a
    // tooltip reading "3 - $45" does not say what the 3 is, so it gets "Jul 3".
    var tipLabels = opts.tipLabels || labels;
    var W = 340, H = opts.height || 180;
    var padL = 42, padT = 10, padB = 22, padR = 6;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var maxV = 0, minV = 0;
    if (opts.stacked) {
      labels.forEach(function(_, i) {
        var pos = 0, neg = 0;
        series.forEach(function(s) { var v = s.values[i] || 0; if (v >= 0) pos += v; else neg += v; });
        if (pos > maxV) maxV = pos;
        if (neg < minV) minV = neg;
      });
    } else {
      series.forEach(function(s) {
        s.values.forEach(function(v) { if (v > maxV) maxV = v; if (v < minV) minV = v; });
      });
    }
    if (maxV === 0 && minV === 0) maxV = 1;

    var f = chartFrame(W, H, padL, padT, plotW, plotH, maxV, minV, labels);
    var y = f.y, parts = f.parts;
    var zeroY = y(0);
    var groupW = plotW / labels.length;

    labels.forEach(function(lab, i) {
      var gx = padL + groupW * i;
      if (opts.stacked) {
        var acc = 0;
        series.forEach(function(s) {
          var v = s.values[i] || 0;
          var y0 = y(acc), y1 = y(acc + v);
          acc += v;
          parts.push('<rect class="bar-seg" data-label="' + attrEscape(s.name) + '" data-tip="' + attrEscape(tipLabels[i]) +
            '" data-value="' + v + '" data-color="' + s.color +
            '" x="' + (gx + groupW * 0.22).toFixed(1) + '" y="' + Math.min(y0, y1).toFixed(1) +
            '" width="' + (groupW * 0.56).toFixed(1) + '" height="' + Math.max(Math.abs(y1 - y0), 0.5).toFixed(1) +
            '" fill="' + s.color + '" rx="3"/>');
        });
      } else {
        var bw = (groupW * 0.64) / series.length;
        series.forEach(function(s, si) {
          var v = s.values[i] || 0;
          var y1 = y(v);
          var fill = typeof s.color === 'function' ? s.color(v) : s.color;
          parts.push('<rect class="bar-seg" data-label="' + attrEscape(s.name) + '" data-tip="' + attrEscape(tipLabels[i]) +
            '" data-value="' + v + '" data-color="' + fill +
            '" x="' + (gx + groupW * 0.18 + bw * si).toFixed(1) + '" y="' + Math.min(zeroY, y1).toFixed(1) +
            '" width="' + bw.toFixed(1) + '" height="' + Math.max(Math.abs(y1 - zeroY), 0.5).toFixed(1) +
            '" fill="' + fill + '" rx="3"/>');
        });
      }
    });

    parts.push('<line x1="' + padL + '" y1="' + zeroY.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + zeroY.toFixed(1) +
      '" stroke="' + ZERO_LINE + '" stroke-width="1"/>');
    parts.push(xLabels(labels, padL, plotW, H, opts.labelEvery || (labels.length > 8 ? 2 : 1)));

    return svgWrap(W, H, parts);
  }

  // width:100% with height driven by the viewBox, so the chart fills a phone
  // screen exactly and stays a sane size on anything wider.
  function svgWrap(W, H, parts) {
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet" ' +
      'style="display:block;height:auto;max-width:560px;margin:0 auto;">' + parts.join('') + '</svg>';
  }

  // Small multiples: one tiny chart per category instead of one chart with every
  // category on it. Five lines sharing a phone-width plot was unreadable, and a
  // line implies values between the months that don't exist — a month's spend is
  // a bucket, so bars are the honest mark. Each row is scaled to its OWN max, so
  // Groceries being ten times Shopping doesn't flatten Shopping into nothing.
  // That trades away cross-category size comparison, which the Month tab's
  // "Spending by Category" list already does better than a chart can.
  function buildSparkRow(s, partialLast) {
    // 80px, not wider: on a 390px phone the fixed columns have to leave room for
    // the longest real category name ("Entertainment & Subscriptions") to sit
    // unclipped. Six bars still read clearly at this size.
    var W = 80, H = 26, n = s.values.length;
    var slot = W / n, bw = Math.max(2, slot - 3);
    var max = 0;
    s.values.forEach(function(v) { if (v > max) max = v; });
    if (max <= 0) max = 1;

    var bars = s.values.map(function(v, i) {
      var h = Math.max(1.5, (v / max) * (H - 2));
      // The last month is dimmed when it's still in progress — at full strength
      // a half-finished month reads as a real drop in spending.
      var dim = (partialLast && i === n - 1) ? ' opacity="0.45"' : '';
      return '<rect x="' + (slot * i + (slot - bw) / 2).toFixed(1) + '" y="' + (H - h).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) +
        '" fill="' + s.color + '" rx="2"' + dim + '/>';
    }).join('');

    var d = s.delta;
    var cls = d === null ? '' : (d > 5 ? 'up' : (d < -5 ? 'down' : ''));
    var txt = d === null ? '--' : (Math.abs(d) <= 5 ? 'flat' : (d > 0 ? '+' : '') + d + '%');

    return '<div class="spark-row" data-category="' + attrEscape(s.name) + '">' +
      '<div class="spark-main">' +
        '<div class="spark-name">' + s.name + '</div>' +
        '<div class="spark-total">' + fmtMoney(s.total) + ' total</div>' +
      '</div>' +
      '<svg class="spark-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' + bars + '</svg>' +
      '<div class="spark-delta ' + cls + '">' + txt + '</div>' +
    '</div>';
  }

  // Last complete month against the average of the complete months before it.
  // Deliberately ignores the in-progress month, which would always read as a
  // collapse. Null when there aren't two complete months to compare.
  function trendDelta(values, completeCount) {
    if (completeCount < 2) return null;
    var last = values[completeCount - 1], sum = 0;
    for (var i = 0; i < completeCount - 1; i++) sum += values[i];
    var avg = sum / (completeCount - 1);
    if (avg <= 0) return null;
    return Math.round(((last - avg) / avg) * 100);
  }

  function legend(items) {
    return '<div class="legend">' + items.map(function(it) {
      return '<span><i style="background:' + it.color + '"></i>' + it.name + '</span>';
    }).join('') + '</div>';
  }

  function chartCard(title, note, svg, legendItems) {
    return '<div class="card chart-card">' +
      '<div class="chart-title">' + title + '</div>' +
      (note ? '<div class="chart-note">' + note + '</div>' : '') +
      svg +
      (legendItems ? legend(legendItems) : '') +
      '</div>';
  }

  // --- App ---
  function initApp() {
    function switchToPage(pageName) {
      $all('.nav-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.page === pageName); });
      $all('.page').forEach(function(p) { p.classList.toggle('active', p.id === 'page-' + pageName); });
      $('main').scrollTop = 0;
      hideChartTooltip();
    }

    // Where a category drill-down came FROM, so History can offer a way back.
    // Null whenever History was reached through the tab bar -- there is nothing to
    // return to in that case and the button stays hidden rather than offering a jump
    // the user never made.
    var drillOrigin = null;

    function setDrillOrigin() {
      var active = document.querySelector('.page.active');
      var page = active ? active.id.replace('page-', '') : '';
      // Capture the Spending sub-view too. The two drill-downs start from DIFFERENT
      // sub-views -- a category row from This month, a sparkline row from Over time --
      // so restoring the page alone would land him on the wrong half of the tab.
      var seg = document.querySelector('#spendView button.active');
      seg = seg ? seg.dataset.value : null;

      // NEVER record the destination as the origin. Both drill-down handlers are
      // DELEGATED on #page-spending, and the row that was tapped stays in the DOM
      // after the jump -- so a second click event on that same row re-fires the
      // handler with History already active, and the button then reads "Back to
      // History" and goes nowhere.
      //
      // On iOS that second event is routine, not exotic: a tap fires touchend and
      // then a synthetic click roughly 300ms later, so one finger tap can run the
      // handler twice with a page switch in between. A single synthetic click in a
      // desktop test never reproduces it, which is why this shipped.
      //
      // Keep whatever origin we already had and fall back to Spending -- the only
      // page either drill-down can legitimately start from.
      if (page === 'transactions' || !page) {
        page = (drillOrigin && drillOrigin.page) || 'spending';
        seg = (drillOrigin && drillOrigin.seg) || seg;
      }
      drillOrigin = { page: page, seg: seg };
      var navBtn = document.querySelector('.nav-btn[data-page="' + page + '"]');
      var back = $('#tf-back');
      back.textContent = '\u2039 Back to ' + (navBtn ? navBtn.textContent.trim() : page);
      back.removeAttribute('hidden');
    }

    function clearDrillOrigin() {
      drillOrigin = null;
      $('#tf-back').setAttribute('hidden', '');
    }

    $all('.nav-btn').forEach(function(btn) {
      // Using the tab bar abandons the drill-down, so the crumb goes with it --
      // otherwise the button lingers and offers to "go back" somewhere he never was.
      btn.addEventListener('click', function() { clearDrillOrigin(); switchToPage(btn.dataset.page); });
    });

    $('#tf-back').addEventListener('click', function() {
      if (!drillOrigin) return;
      var page = drillOrigin.page, seg = drillOrigin.seg;
      clearDrillOrigin();
      switchToPage(page);
      if (seg) {
        var segBtn = document.querySelector('#spendView button[data-value="' + seg + '"]');
        if (segBtn) segBtn.click();     // reuse the real handler rather than re-implementing it
      }
    });
    // Month / Over time within Spending.
    $all('#spendView button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        $all('#spendView button').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var want = btn.dataset.value === 'month' ? 'spendMonth' : 'spendTrends';
        $all('#page-spending .subview').forEach(function(v) { v.classList.toggle('active', v.id === want); });
      });
    });


    // Hover tooltip for the hand-rolled SVG bar charts. Delegated on the
    // (static) pages rather than the (re-rendered) chart containers, so it keeps
    // working across every re-render. ONE implementation for both pages -- these
    // were two copies of the same six lines and had already drifted apart (one
    // spelled the separator '\u00b7', the other used a literal middle dot).
    var chartTooltip = $('#chartTooltip');
    // Null-guarded because switchToPage() is declared above the line that assigns
    // chartTooltip, and calls hideChartTooltip.
    function hideChartTooltip() { if (chartTooltip) chartTooltip.classList.remove('show'); }

    // The series name is deliberately NOT in the text. Every chart with a tooltip
    // either carries a legend or has one series named by the chart's own title,
    // so the name restated something already on screen -- and it was most of the
    // width that pushed right-hand-edge tooltips off the viewport. The bar's own
    // colour identifies the series instead.
    function showChartTooltip(e, seg) {
      chartTooltip.textContent = seg.dataset.tip + ' \u00b7 ' + fmtMoney(seg.dataset.value);
      chartTooltip.style.color = seg.dataset.color || '';

      // Measure only AFTER the text is set and the box is shown -- while it is
      // display:none the rect is 0x0 and every clamp below silently does nothing.
      chartTooltip.classList.add('show');
      var box = chartTooltip.getBoundingClientRect();
      var vw = document.documentElement.clientWidth;
      var vh = document.documentElement.clientHeight;
      var gap = 14, edge = 8;

      // Bars on the right-hand edge used to run off screen: the tooltip was pinned
      // to the cursor's right with no bound at all. Prefer the right, flip to the
      // left when that would overflow, then clamp -- the clamp is what rescues a
      // tooltip too wide for the space on either side.
      var left = e.clientX + gap;
      if (left + box.width > vw - edge) left = e.clientX - gap - box.width;
      left = Math.max(edge, Math.min(left, vw - edge - box.width));

      var top = e.clientY + gap;
      if (top + box.height > vh - edge) top = e.clientY - gap - box.height;
      top = Math.max(edge, Math.min(top, vh - edge - box.height));

      chartTooltip.style.left = left + 'px';
      chartTooltip.style.top = top + 'px';
    }

    ['#page-spending', '#page-transactions'].forEach(function(sel) {
      var host = $(sel);
      host.addEventListener('mousemove', function(e) {
        var seg = e.target.closest && e.target.closest('.bar-seg');
        if (!seg) { hideChartTooltip(); return; }
        showChartTooltip(e, seg);
      });
      host.addEventListener('mouseleave', hideChartTooltip);
    });

    // mouseleave never fires from touch input, so on a phone the tooltip had no way
    // to close: it sat there over whatever you looked at next. touchstart fires
    // BEFORE the synthetic mousemove iOS sends afterwards, so tapping a bar still
    // shows its tooltip -- this only kills the stale one. Bound on document, not on
    // the two chart pages, because the taps that used to leave it stranded (the nav
    // bar, the header) are outside them. Scrolling dismisses it too: the tooltip is
    // position:fixed, so it would otherwise hang in place while its bar slid away.
    document.addEventListener('touchstart', hideChartTooltip, { passive: true });
    $('main').addEventListener('scroll', hideChartTooltip, { passive: true });

    function showToast(message, isError) {
      var toast = $('#toast');
      toast.textContent = message;
      toast.className = 'toast show ' + (isError ? 'error' : 'ok');
      setTimeout(function() { toast.classList.remove('show'); }, 3200);
    }

    // cardCls carries 'kpi-hero' for the one figure a screen leads with. Six
    // identically-sized tiles gave every number the same importance, which meant
    // none of them read as the answer to "are we okay this month".
    function kpiCard(label, value, cls, sub, cardCls) {
      return '<div class="card' + (cardCls ? ' ' + cardCls : '') + '">' +
        '<div class="kpi-label">' + label + '</div>' +
        '<div class="kpi-value ' + cls + '">' + value + '</div>' +
        (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') + '</div>';
    }

    function loadData() {
      apiGet('dashboard').then(function(data) {
        if (data.error) { showToast('Could not load data: ' + data.error, true); return; }
        renderData(data);
      }).catch(function(err) {
        showToast('Could not load data: ' + err, true);
      });
    }

    function renderData(data) {
      $('#lastUpdated').textContent = data.kpis.lastUpdated || '';

      var netClass = Number(data.kpis.netCashFlow) < 0 ? 'negative' : 'positive';
      var checkClass = Number(data.kpis.checkingChange) < 0 ? 'negative' : 'positive';
      // Home answers "how do we run, typically" — every figure here is a long-run
      // average or a standing balance. The Spending tab answers "what happened in
      // one month". Keeping the hero here and dropping it there is what stops the
      // two screens reading as the same screen twice.
      $('#kpiGrid').innerHTML =
        kpiCard('Average monthly net', fmtMoney(data.kpis.netCashFlow), netClass,
          'income minus everything, complete months only', 'kpi-hero') +
        kpiCard('Avg monthly income', fmtMoney(data.kpis.avgIncome), 'positive') +
        kpiCard('Avg monthly spend', fmtMoney(data.kpis.avgSpend), '') +
        kpiCard('Card utilization', data.kpis.cardUtilization, '',
          fmtMoney(data.kpis.cardBalance) + ' of ' + fmtMoney(data.kpis.cardLimit)) +
        kpiCard('Checking change', fmtMoney(data.kpis.checkingChange), checkClass, 'year to date') +
        kpiCard('Top variable spend', data.kpis.topCategory, 'is-text', 'fixed costs excluded', 'kpi-wide');

      $('#pooledCard').innerHTML =
        '<p><span class="label">Seed balance</span><span>' + fmtMoney(data.pooled.seedBalance) + '</span></p>' +
        '<p><span class="label">Internal transfers</span><span>' + fmtMoney(data.pooled.runningTransfers) + '</span></p>' +
        '<p><span class="label">Total pooled balance</span><span><strong>' + fmtMoney(data.pooled.totalBalance) + '</strong></span></p>' +
        '<p><span class="label">Total allocated</span><span>' + fmtMoney(data.pooled.totalAllocated) + '</span></p>' +
        '<div class="reconcile">' + data.pooled.reconciliation + '</div>';

      $('#goalsList').innerHTML = data.goals.map(function(g) {
        var hasTarget = g.target !== '' && g.target !== null;
        var pct = hasTarget ? Math.max(0, Math.min(100, (g.allocated / g.target) * 100)) : 0;
        return '<div class="card goal-card">' +
          '<div class="row"><span class="name">' + g.name + '</span>' +
          '<span class="amounts">' + fmtMoney(g.allocated) + ' / ' + (hasTarget ? fmtMoney(g.target) : 'no target') + '</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
          (g.targetDate ? '<div class="goal-note">Target date: ' + g.targetDate + '</div>' : '') +
          (g.notes ? '<div class="goal-note">' + g.notes + '</div>' : '') +
          '</div>';
      }).join('');
    }

    // Debt payoff. A loan is the INVERSE of a savings goal -- start at a balance and
    // drive it to zero -- but the same bar reads correctly for both: target is the
    // original principal, progress is the principal actually repaid.
    //
    // The payment stays ONE row in History, matching the bank statement. The split
    // comes from the Loans tab, which is where the bank's own PRINCIPAL/INTEREST
    // figures are recorded. Trevon, 2026-08-24: "one row with the split stored
    // alongside it. I still want it shown clearly in the app."
    function renderLoans(loans) {
      if (!loans || !loans.length) return;          // section stays hidden
      $('#debtTitle').removeAttribute('hidden');
      $('#debtList').removeAttribute('hidden');

      $('#debtList').innerHTML = loans.map(function(L) {
        var pct = Math.max(0, Math.min(100, L.pctPaid || 0));
        var parts = [];

        parts.push('<div class="row"><span class="name">' + L.name + '</span>' +
          '<span class="amounts">' + fmtMoneyCents(L.currentBalance) + ' left</span></div>');
        parts.push('<div class="bar-track"><div class="bar-fill good" style="width:' + pct + '%"></div></div>');
        // A card's baseline is where tracking started, NOT an origination amount, so it
        // must not be described as "of $X paid off" -- that would imply the balance was
        // once a loan of that size and is being retired. Say what it actually is.
        if (L.kind === 'card') {
          parts.push('<div class="goal-note">' + fmtMoneyCents(L.principalPaid) +
            ' paid down \u00b7 ' + pct.toFixed(1) + '% of the ' + fmtMoneyCents(L.originalPrincipal) +
            ' starting balance' +
            (L.utilization !== null ? ' \u00b7 ' + L.utilization + '% of the ' +
              fmtMoney(L.creditLimit) + ' limit' : '') + '</div>');
        } else {
          parts.push('<div class="goal-note">' + fmtMoneyCents(L.principalPaid) + ' of ' +
            fmtMoneyCents(L.originalPrincipal) + ' paid off \u00b7 ' + pct.toFixed(1) + '%</div>');
        }

        // The split, stated rather than implied.
        if (L.lastPrincipal !== null && L.lastInterest !== null) {
          parts.push('<div class="split">' +
            '<span>Last payment ' + fmtMoneyCents(L.payment) + '</span>' +
            '<span class="sep">=</span>' +
            '<span class="to-debt">' + fmtMoneyCents(L.lastPrincipal) +
              (L.kind === 'card' ? ' off the balance' : ' to the loan') + '</span>' +
            '<span class="sep">+</span>' +
            '<span class="to-interest">' + fmtMoneyCents(L.lastInterest) + ' interest' +
            (L.lastInterestPct !== null ? ' (' + L.lastInterestPct + '%)' : '') + '</span>' +
            '</div>');
        }

        var note = [];
        if (L.apr) note.push((L.apr * 100).toFixed(3) + '% APR');
        if (L.paymentsLeft) note.push(L.paymentsLeft + ' payments left');
        if (L.futureInterest) note.push(fmtMoney(L.futureInterest) + ' interest still to come');
        if (L.interestPaid) note.push(fmtMoney(L.interestPaid) + ' interest paid so far');
        if (note.length) parts.push('<div class="payoff-note">' + note.join(' \u00b7 ') + '</div>');

        // One scenario, not three -- a menu of options is a decision deferred. The
        // $100 case is the one that reads as reachable against the current overspend.
        var pick = null;
        (L.scenarios || []).forEach(function(sc) { if (sc.extraPerMonth === 100) pick = sc; });
        if (!pick && L.scenarios && L.scenarios.length) pick = L.scenarios[0];
        if (pick && pick.interestSaved > 0) {
          parts.push('<div class="payoff-win">Paying ' + fmtMoney(pick.extraPerMonth) +
            ' more a month clears it ' + pick.monthsSooner + ' months sooner and saves ' +
            fmtMoney(pick.interestSaved) + ' in interest.</div>');
        }

        // Never quietly reconcile a disagreement: say it and let a human judge.
        if (L.paymentCountAgrees === false) {
          parts.push('<div class="payoff-note">Schedule says ' + L.paymentsMade +
            ' payments made, the calendar says ' + L.paymentsMadeByCalendar +
            ' \u2014 check for a missed or extra payment.</div>');
        }

        return '<div class="card goal-card">' + parts.join('') + '</div>';
      }).join('');
    }

    apiGet('loans').then(function(data) {
      if (!data || data.error) return;              // no Loans tab yet is not an error
      renderLoans(data);
    }).catch(function() { /* the section simply stays hidden */ });

    // Targets come from the Sheet's Budget tab. renderBudgets() guards on
    // budgetDefs being null, so whichever of these two fetches lands second is
    // the one that paints — no ordering assumption between them.
    apiGet('budgets').then(function(data) {
      budgetDefs = (data && data.error) ? [] : (data || []);
      if (data && data.error) showToast('Could not load budgets: ' + data.error, true);
      renderBudgets();
    }).catch(function(err) {
      budgetDefs = [];
      $('#budgetList').innerHTML = '<div class="loading">Could not load budgets: ' + err + '</div>';
    });

    $('#personFilter').addEventListener('click', function(e) {
      var btn = e.target.closest && e.target.closest('button[data-person]');
      if (!btn) return;
      personFilter = btn.dataset.person || '';
      renderBudgets();
    });

    apiGet('categories').then(function(categories) {
      if (categories.error) return;
      $('#tf-category').innerHTML = '<option value="">All Categories</option>' +
        categories.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
    });

    var allTransactions = [];

    function txnRow(t) {
      var cls = Number(t.amount) < 0 ? 'negative' : 'positive';
      var badge = t.account === 'credit' ? 'Credit Card' : 'Checking';
      return '<div class="txn-row">' +
        '<div class="txn-main">' +
          '<div class="txn-merchant">' + t.merchant + '</div>' +
          '<div class="txn-meta">' + t.date + ' · ' + badge + ' · ' + t.category + '</div>' +
        '</div>' +
        '<div class="txn-amount ' + cls + '">' + fmtMoney(t.amount) + '</div>' +
      '</div>';
    }

    function renderTransactionList(list, hiddenCount) {
      // Say so when rows are being withheld. A count that silently disagrees with the
      // bank statement is how someone stops trusting the whole app.
      $('#txnCount').textContent = list.length + (list.length === 1 ? ' transaction' : ' transactions') +
        (hiddenCount ? ' \u00b7 ' + hiddenCount + ' card-payment ' +
                       (hiddenCount === 1 ? 'row' : 'rows') + ' hidden' : '');
      $('#txnList').innerHTML = list.length
        ? list.map(txnRow).join('')
        : '<div class="loading">No transactions match these filters.</div>';
    }

    // --- Category detail chart (History) ----------------------------------
    // A Top Variable Categories row now lands here, so the big version of that
    // sparkline has to live on this page. It draws only for a SINGLE category:
    // across "All Categories" the bars would just be the household total, which
    // the Spending tab already draws better.
    function ytdStart() { return new Date().getFullYear() + '-01-01'; }

    // '' unless the range is exactly one whole calendar month, in which case the
    // month key. Granularity hangs off this: a one-bar chart says nothing, and
    // the day pattern inside a month is the thing the year view cannot show.
    function rangeIsOneMonth(from, to) {
      if (!from || !to) return '';
      if (from.slice(0, 7) !== to.slice(0, 7)) return '';
      var key = from.slice(0, 7);
      var lastDay = new Date(Number(key.slice(0, 4)), Number(key.slice(5, 7)), 0).getDate();
      var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
      if (from.slice(8, 10) !== '01' || to.slice(8, 10) !== pad(lastDay)) return '';
      return key;
    }

    function txnChartData(list, oneMonth) {
      // Outflows only, matching the sparkline this is the big version of. A
      // refund still shows in the list below, so bars and list can disagree by
      // the refund amount — stated in the note rather than silently netted,
      // because netting here would make the two charts contradict each other.
      var spend = list.filter(function(t) { return Number(t.amount) < 0; });
      // In daily mode, confine to the charted month here rather than trusting the
      // caller to have filtered already — otherwise July 3rd's spend lands on
      // August 3rd's bar, which is exactly the kind of wrong that looks right.
      if (oneMonth) spend = spend.filter(function(t) { return t.date.slice(0, 7) === oneMonth; });
      var labels = [], values = [], keys = [];
      if (oneMonth) {
        var days = new Date(Number(oneMonth.slice(0, 4)), Number(oneMonth.slice(5, 7)), 0).getDate();
        var byDay = {};
        spend.forEach(function(t) { var d = Number(t.date.slice(8, 10)); byDay[d] = (byDay[d] || 0) + (-t.amount); });
        for (var d = 1; d <= days; d++) { labels.push(String(d)); values.push(byDay[d] || 0); }
      } else {
        var byMonth = {};
        spend.forEach(function(t) { var k = t.date.slice(0, 7); byMonth[k] = (byMonth[k] || 0) + (-t.amount); });
        keys = Object.keys(byMonth).sort();
        keys.forEach(function(k) { labels.push(shortMonth(k)); values.push(byMonth[k]); });
      }
      return { labels: labels, values: values, keys: keys, count: spend.length,
               total: values.reduce(function(a, b) { return a + b; }, 0) };
    }

    function renderTxnChart(list) {
      var host = $('#txnChart');
      var category = $('#tf-category').value;
      if (!category) { host.innerHTML = ''; return; }

      var oneMonth = rangeIsOneMonth($('#tf-from').value, $('#tf-to').value);
      var d = txnChartData(list, oneMonth);
      if (!d.count) { host.innerHTML = ''; return; }

      var refunds = 'Outflows only \u2014 a refund shows in the list below but not in the bars.';
      var title, note;
      if (oneMonth) {
        title = category + ' \u00b7 ' + monthLabel(oneMonth);
        note = 'One bar per day. ' + refunds;
      } else {
        title = category;
        note = (d.keys.length ? monthLabel(d.keys[0]) + ' \u2192 ' + monthLabel(d.keys[d.keys.length - 1]) + '. ' : '') +
          'One bar per month. ' + refunds;
      }

      host.innerHTML = chartCard(title, note,
        buildBarChart(d.labels, [{ name: category, color: SPARK_COLOR, values: d.values }],
          { height: 190, labelEvery: d.labels.length > 20 ? 5 : (d.labels.length > 8 ? 2 : 1),
            tipLabels: oneMonth ? d.labels.map(function(day) { return shortMonth(oneMonth) + ' ' + day; }) : null })) +
        '<div class="txn-count">' + fmtMoney(d.total) + ' total across ' + d.count +
          (d.count === 1 ? ' outflow' : ' outflows') + '</div>';
    }

    // The Month control writes into From/To rather than standing beside them as a
    // second date filter, so the chart and the list can never disagree.
    function initTxnMonths() {
      var keys = sortedMonthKeys().reverse();
      $('#tf-month').innerHTML = '<option value="">Year to date</option>' +
        keys.map(function(k) { return '<option value="' + k + '">' + monthLabel(k) + '</option>'; }).join('');
    }

    function syncMonthSelect() {
      $('#tf-month').value = rangeIsOneMonth($('#tf-from').value, $('#tf-to').value) || '';
    }

    // The row label stays "Filters" regardless. This only drives the accent
    // tint, which is what stops a collapsed panel hiding the fact that the list
    // is not showing everything.
    function hasActiveFilters() {
      return !!($('#tf-category').value || $('#tf-from').value || $('#tf-to').value);
    }

    function updateFilterSummary() {
      $('#tf-toggle').classList.toggle('filtered', hasActiveFilters());
    }

    $('#tf-toggle').addEventListener('click', function() {
      var panel = $('#tf-panel');
      var open = panel.hasAttribute('hidden');
      if (open) panel.removeAttribute('hidden'); else panel.setAttribute('hidden', '');
      $('#tf-toggle').setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    // Paying the Capital One card is not a transaction, it is the SAME money twice:
    // 'Credit Card Payments' is the leg that leaves checking and 'Card Payment' is the
    // leg that lands on the card, equal and opposite, a day apart. 70 rows, $29,813
    // out against $28,172 in, netting to nothing -- and being the largest figures in
    // the file they owned the top of the amount sort. The spending they settle was
    // already counted the day the card was swiped.
    //
    // 'Internal Savings Transfer' is a transfer too and is deliberately NOT hidden:
    // it is the thing the household is actively trying to do more of, and hiding the
    // evidence of it would be the wrong kind of tidy.
    //
    // Real debt paydown stays visible throughout -- Auto Loan Payment, Credit Line
    // Payment, Student Loans, Buy Now Pay Later, Ring Financing. That money genuinely
    // left the household, which is the whole distinction.
    var TRANSFER_LEGS = { 'Credit Card Payments': true, 'Card Payment': true };

    function applyTxnFilters() {
      var from = $('#tf-from').value;
      var to = $('#tf-to').value;
      var category = $('#tf-category').value;
      var showTransfers = $('#tf-transfers').checked;
      var hidden = 0;
      var filtered = allTransactions.filter(function(t) {
        if (from && t.date < from) return false;
        if (to && t.date > to) return false;
        if (category && t.category !== category) return false;
        // Yields to an explicit choice: selecting 'Credit Card Payments' in the
        // Category filter means he wants to see them, so the hide rule stands down.
        if (!showTransfers && TRANSFER_LEGS[t.category] && category !== t.category) {
          hidden++;
          return false;
        }
        return true;
      });

      // .filter() hands back a new array, so sorting it never disturbs the order of
      // allTransactions itself. Sort explicitly in BOTH modes -- switching back to
      // Date has to actually restore date order, not just stop re-sorting.
      if ($('#tf-sort').value === 'amount') {
        // Outflows first, largest to smallest, THEN inflows largest to smallest.
        //
        // Sorting purely by size looked right and was useless: with All Categories
        // selected the top of the list was six consecutive payroll deposits, because a
        // $2,132 paycheck outranks every expense in the household. Sorting by the raw
        // signed value is worse still -- it buries the biggest spend at the very bottom.
        // Money out is what this list gets opened for, so money out comes first, and
        // money in is grouped after it rather than interleaved.
        filtered.sort(function(a, b) {
          var aOut = a.amount < 0, bOut = b.amount < 0;
          if (aOut !== bOut) return aOut ? -1 : 1;
          return Math.abs(b.amount) - Math.abs(a.amount);
        });
      } else {
        filtered.sort(function(a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
      }

      renderTransactionList(filtered, hidden);
      // The chart buckets by day or month, so it is unaffected by list order -- it is
      // deliberately given the same array rather than a date-sorted copy.
      renderTxnChart(filtered);
      updateFilterSummary();
    }

    function loadTransactions() {
      apiGet('transactions').then(function(data) {
        if (data.error) { $('#txnList').innerHTML = '<div class="loading">' + data.error + '</div>'; return; }
        allTransactions = data;
        initTxnMonths();
        applyTxnFilters();
        initSummary();
        renderTrends();
        renderBudgets();
      }).catch(function(err) {
        $('#txnList').innerHTML = '<div class="loading">Could not load transactions: ' + err + '</div>';
      });
    }

    // --- Shared month maths -------------------------------------------------
    // Sign convention: every row is negative when money left the household,
    // on both Checking and Credit. So "spend" is always -amount.
    var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var CREDIT_EXCLUDE = { 'Card Payment': true };

    // Real spending, but the same every month and nothing to decide about, so it
    // crowds out the categories worth looking at. Hidden from anything that RANKS
    // categories; still counted in every total (Net Cash Flow, Avg Monthly Spend,
    // Income vs Spending, and the Month tab's full category breakdown).
    // Student Loans and Insurance are the same kind of thing when you want them.
    // Mirrored by FIXED_COSTS in WebApp.gs, which ranks the Dashboard KPI.
    // Student loans joined rent 2026-08-24 (Trevon: "student loans are fixed").
    // These are excluded from the VARIABLE-spend ranking only -- they are still real
    // money out and still counted in total spend.
    var FIXED_COSTS = { 'Rent/Housing': true, 'Student Loans': true };

    function monthLabel(key) {
      var parts = key.split('-');
      return MONTH_NAMES[Number(parts[1]) - 1] + ' ' + parts[0];
    }
    function shortMonth(key) { return MONTH_NAMES[Number(key.split('-')[1]) - 1]; }

    function computeMonthSummary(monthKey) {
      // ONE bucket. Categories are deliberately NOT split by account: a category
      // paid for from both accounts appeared twice with two half-numbers and no
      // total anywhere, and the tap-through never filtered by account, so the
      // row label promised a split the rest of the app did not honour.
      // The Checking/Credit KPI tiles keep the split — they are one total shown
      // two ways, not a duplicated list — so both are still summed here.
      var catTotals = {};
      var income = 0, ccPayments = 0, autoLoan = 0, creditLine = 0, savingsTransfer = 0;
      var checkingSpend = 0, creditSpend = 0;

      allTransactions.forEach(function(t) {
        if (t.date.slice(0, 7) !== monthKey) return;
        var spend = -t.amount;
        if (t.account === 'checking') {
          if (t.category === 'Income') { income += t.amount; return; }
          if (t.category === 'Credit Card Payments') { ccPayments += spend; return; }
          if (t.category === 'Auto Loan Payment') { autoLoan += spend; return; }
          if (t.category === 'Credit Line Payment') { creditLine += spend; return; }
          if (t.category === 'Internal Savings Transfer') { savingsTransfer += spend; return; }
          checkingSpend += spend;
        } else {
          // The credit leg of a card payment. Without this guard, paying the
          // card reads as spending.
          if (CREDIT_EXCLUDE[t.category]) return;
          creditSpend += spend;
        }
        catTotals[t.category] = (catTotals[t.category] || 0) + spend;
      });

      var categories = Object.keys(catTotals).map(function(cat) {
        return { category: cat, amount: catTotals[cat] };
      }).sort(function(a, b) { return b.amount - a.amount; });

      // Paying the credit card is a transfer between our own accounts, NOT debt
      // paydown — that spending was already counted the day it happened. Debt
      // paydown is the auto loan plus the L0074 credit line. Net cash flow counts credit
      // spending when it HAPPENS rather than when the card gets paid.
      var debtPaydown = autoLoan + creditLine;
      var netCashFlow = income - checkingSpend - creditSpend - autoLoan - creditLine - savingsTransfer;

      return {
        income: income, checkingSpend: checkingSpend, creditSpend: creditSpend,
        totalSpend: checkingSpend + creditSpend, ccPayments: ccPayments, autoLoan: autoLoan, creditLine: creditLine,
        debtPaydown: debtPaydown, savingsTransfer: savingsTransfer, netCashFlow: netCashFlow,
        categories: categories
      };
    }

    function sortedMonthKeys() {
      var months = {};
      allTransactions.forEach(function(t) { months[t.date.slice(0, 7)] = true; });
      return Object.keys(months).sort();
    }

    function lastMonthIsPartial(keys) {
      if (!keys.length) return false;
      var last = keys[keys.length - 1];
      var latest = '';
      allTransactions.forEach(function(t) {
        if (t.date.slice(0, 7) === last && t.date > latest) latest = t.date;
      });
      var daysInMonth = new Date(Number(last.slice(0, 4)), Number(last.slice(5, 7)), 0).getDate();
      return Number(latest.slice(8, 10)) < daysInMonth;
    }

    // --- Trends -------------------------------------------------------------
    function renderTrends() {
      var keys = sortedMonthKeys();
      if (!keys.length) { $('#trendsBody').innerHTML = '<div class="loading">No data yet.</div>'; return; }

      var partial = lastMonthIsPartial(keys);
      var note = partial ? monthLabel(keys[keys.length - 1]) + ' is a partial month.' : '';
      var labels = keys.map(shortMonth);
      var months = keys.map(computeMonthSummary);

      var income = months.map(function(m) { return m.income; });
      var checkingSpend = months.map(function(m) { return m.checkingSpend; });
      var creditSpend = months.map(function(m) { return m.creditSpend; });
      var totalSpend = months.map(function(m) { return m.totalSpend; });
      var net = months.map(function(m) { return m.netCashFlow; });
      var savings = months.map(function(m) { return m.savingsTransfer; });
      var debt = months.map(function(m) { return m.debtPaydown; });

      // Biggest variable spend categories across the whole period, each tracked
      // month by month. Transfers aren't spending; fixed costs are, but they're
      // the same number every month and never win the attention they'd take.
      var completeCount = partial ? keys.length - 1 : keys.length;
      var totals = {};
      allTransactions.forEach(function(t) {
        if (t.amount >= 0) return;
        if (t.category === 'Internal Savings Transfer' || t.category === 'Credit Card Payments' ||
            t.category === 'Auto Loan Payment' || t.category === 'Credit Line Payment' ||
            t.category === 'Card Payment') return;
        if (FIXED_COSTS[t.category]) return;
        totals[t.category] = (totals[t.category] || 0) + (-t.amount);
      });
      var topCats = Object.keys(totals).sort(function(a, b) { return totals[b] - totals[a]; }).slice(0, 6);
      var catSeries = topCats.map(function(cat) {
        var byMonth = {};
        allTransactions.forEach(function(t) {
          if (t.category !== cat || t.amount >= 0) return;
          var k = t.date.slice(0, 7);
          byMonth[k] = (byMonth[k] || 0) + (-t.amount);
        });
        var values = keys.map(function(k) { return byMonth[k] || 0; });
        return {
          name: cat,
          color: SPARK_COLOR,
          values: values,
          total: totals[cat],
          delta: trendDelta(values, completeCount)
        };
      });

      // Sparklines carry no axis of their own, so the span and the reading of the
      // change column have to be stated once here.
      var spanNote = monthLabel(keys[0]) + ' → ' + monthLabel(keys[keys.length - 1]) +
        ', one bar per month. Fixed costs excluded. Change is the last full month against its earlier average.';

      $('#trendsBody').innerHTML =
        chartCard('Income vs Spending', note,
          buildBarChart(labels, [
            { name: 'Income', color: COLORS.income, values: income },
            { name: 'Spending', color: COLORS.spend, values: totalSpend }
          ]),
          [{ name: 'Income', color: COLORS.income }, { name: 'Spending', color: COLORS.spend }]) +

        chartCard('Net Cash Flow', 'Income minus all spending, the auto loan and savings transfers.',
          buildBarChart(labels, [
            { name: 'Net', color: function(v) { return v < 0 ? COLORS.spend : COLORS.income; }, values: net }
          ], { height: 160 })) +

        chartCard('Where the Spending Sits', 'Checking and credit card, stacked.',
          buildBarChart(labels, [
            { name: 'Checking', color: COLORS.checking, values: checkingSpend },
            { name: 'Credit Card', color: COLORS.credit, values: creditSpend }
          ], { stacked: true }),
          [{ name: 'Checking', color: COLORS.checking }, { name: 'Credit Card', color: COLORS.credit }]) +

        chartCard('Debt Paydown &amp; Savings',
          'Auto loan and credit line — paying the credit card is a transfer, not debt paydown.',
          buildBarChart(labels, [
            { name: 'Debt Paydown', color: COLORS.spend, values: debt },
            { name: 'Savings', color: COLORS.savings, values: savings }
          ], { height: 160 }),
          [{ name: 'Debt Paydown', color: COLORS.spend }, { name: 'Savings', color: COLORS.savings }]) +

        chartCard('Top Variable Categories', spanNote,
          catSeries.map(function(s) { return buildSparkRow(s, partial); }).join(''));
    }

    // --- Monthly summary ----------------------------------------------------
    function catRows(list) {
      if (!list.length) return '<div class="loading">No spending recorded for this month.</div>';
      return list.map(function(c) {
        var cls = c.amount < 0 ? 'negative' : '';
        return '<div class="cat-row cat-row-link" data-category="' + attrEscape(c.category) + '">' +
          '<span>' + c.category + '</span>' +
          '<span class="amt ' + cls + '">' + fmtMoney(c.amount) + '<span class="chev">›</span></span>' +
          '</div>';
      }).join('');
    }

    // Tapping a category row jumps to History pre-filtered to that category
    // and the month currently shown in Summary.
    function monthDateRange(monthKey) {
      var parts = monthKey.split('-');
      var year = Number(parts[0]), month = Number(parts[1]);
      var lastDay = new Date(year, month, 0).getDate();
      var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
      return { from: monthKey + '-01', to: monthKey + '-' + pad(lastDay) };
    }

    function ensureCategoryOption(category) {
      var sel = $('#tf-category');
      var exists = Array.prototype.some.call(sel.options, function(o) { return o.value === category; });
      if (!exists) {
        var opt = document.createElement('option');
        opt.value = category;
        opt.textContent = category;
        sel.appendChild(opt);
      }
    }

    function goToHistoryFiltered(category, monthKey) {
      var range = monthDateRange(monthKey);
      ensureCategoryOption(category);
      $('#tf-from').value = range.from;
      $('#tf-to').value = range.to;
      $('#tf-category').value = category;
      syncMonthSelect();
      applyTxnFilters();
      setDrillOrigin();          // must run BEFORE the switch -- it reads the active page
      switchToPage('transactions');
    }

    $('#summaryCats').addEventListener('click', function(e) {
      var row = e.target.closest('.cat-row-link');
      if (!row) return;
      goToHistoryFiltered(row.dataset.category, $('#summaryMonth').value);
    });

    // Same tap-through from the Trends rows, but with no date range — a Trends
    // row covers the whole period, not one month. Delegated on the static page
    // element because #trendsBody is replaced on every renderTrends().
    $('#page-spending').addEventListener('click', function(e) {
      var row = e.target.closest && e.target.closest('.spark-row');
      if (!row) return;
      ensureCategoryOption(row.dataset.category);
      $('#tf-from').value = ytdStart();
      $('#tf-to').value = '';
      $('#tf-month').value = '';
      $('#tf-category').value = row.dataset.category;
      applyTxnFilters();
      setDrillOrigin();          // must run BEFORE the switch -- it reads the active page
      switchToPage('transactions');
    });

    // --- Budgets -----------------------------------------------------------
    // The targets are an INPUT, read from the Sheet's `Budget` tab through
    // action=budgets, exactly like Goals. Changing a target is a Sheet edit, not
    // a deploy. Null until the fetch lands; every render guards on that.
    var budgetDefs = null;
    var personFilter = '';        // '' = everyone, otherwise a person's name

    // Outflows only, so a refund reduces the month the way it actually did.
    // Savings transfers are negative on checking like any other outflow, so this
    // works for them unchanged.
    function monthCategoryTotal(monthKey, cats, person) {
      var total = 0;
      allTransactions.forEach(function(t) {
        if (t.date.slice(0, 7) !== monthKey) return;
        if (t.amount >= 0) return;
        if (cats.indexOf(t.category) === -1) return;
        if (person && t.person !== person) return;
        total += -t.amount;
      });
      return total;
    }

    // Everyone the data can actually attribute a row to. 'Unassigned' is not a
    // person, so it is excluded — which is why the filter stays hidden until a
    // card has actually been recorded on a row.
    function peopleInData() {
      var seen = {};
      allTransactions.forEach(function(t) {
        if (t.person && t.person !== 'Unassigned') seen[t.person] = true;
      });
      return Object.keys(seen).sort();
    }

    // Groceries swings 3x month to month because of big stock-up trips, so a
    // single calendar month flags a problem that isn't one. Averaged over the
    // selected month and the two before it.
    function trailingAverage(monthKey, cats, n, person) {
      var keys = sortedMonthKeys();
      var i = keys.indexOf(monthKey);
      if (i < 0) return { value: 0, months: 0 };
      var window = keys.slice(Math.max(0, i - n + 1), i + 1);
      var sum = 0;
      window.forEach(function(k) { sum += monthCategoryTotal(k, cats, person); });
      return { value: window.length ? sum / window.length : 0, months: window.length };
    }

    // Budgets live on the Goals page and always show the LATEST month, because
    // that page answers "how are we doing" rather than "what happened in June".
    // The Spending tab is where a specific month gets picked apart.
    // The track is a SCALE, not the target. Capping the fill at the target made
    // every over-budget bar identical - Shopping at 326% of budget rendered the
    // same as Dining at 140% - so the bar said "over" and nothing about how far.
    // Now the bar runs past a tick that marks the target, and the tick's position
    // carries the magnitude: the further left it sits, the worse the overage.
    //
    // The 25% headroom keeps the tick off the right edge when under budget, where
    // it would otherwise be flush with the end of the track and invisible.
    // Its own function so the maths can be tested without a DOM.
    function budgetBarGeometry(actual, target) {
      var scaleMax = Math.max(target * 1.25, actual);
      if (!(scaleMax > 0)) return { barPct: 0, targetPct: 0, showTick: false };
      return {
        barPct: Math.min(100, (actual / scaleMax) * 100),
        targetPct: Math.min(100, (target / scaleMax) * 100),
        // A zero target pins the tick to the left edge, where it reads as part of
        // the track rather than a marker. The note says "target is zero" instead.
        showTick: target > 0
      };
    }

    function renderBudgets() {
      var host = $('#budgetList');
      if (!budgetDefs) { host.innerHTML = '<div class="loading">Loading budgets\u2026</div>'; return; }
      if (!budgetDefs.length) {
        host.innerHTML = '<div class="loading">No budgets set. Add rows to the Budget tab in the Sheet.</div>';
        $('#budgetMonthNote').textContent = '';
        return;
      }
      var keys = sortedMonthKeys();
      if (!keys.length) { host.innerHTML = '<div class="loading">No data yet.</div>'; return; }

      var monthKey = keys[keys.length - 1];
      var partial = lastMonthIsPartial(keys);

      renderPersonFilter();

      // Only budgets with a per-person target can be split. Savings, Groceries
      // and Buy Now Pay Later are household concepts and do not divide, so they
      // are hidden rather than shown against a target that does not apply.
      var defs = personFilter
        ? budgetDefs.filter(function(b) { return b.perPerson !== null && b.perPerson !== undefined; })
        : budgetDefs;

      var subject = personFilter ? personFilter : 'the household';
      $('#budgetMonthNote').textContent = monthLabel(monthKey) +
        (partial ? ', still in progress' : '') + ' \u00b7 ' + subject +
        (personFilter ? ' \u00b7 household-only budgets hidden' : '');

      if (!defs.length) {
        host.innerHTML = '<div class="loading">No per-person budgets are set.</div>';
        return;
      }

      host.innerHTML = defs.map(function(b) {
        var target = personFilter ? b.perPerson : b.monthly;
        var actual, basis;
        if (b.method === 'avg3') {
          var ta = trailingAverage(monthKey, b.categories, 3, personFilter);
          actual = ta.value;
          basis = ta.months + '-month average';
        } else {
          actual = monthCategoryTotal(monthKey, b.categories, personFilter);
          basis = '';
        }

        var up = b.better === 'up';
        // A zero target cannot be a ratio, so "missed" is a comparison, not a
        // percentage. Under target is the miss for savings, over for spending.
        var missed = up ? (actual < target - 0.005) : (actual > target + 0.005);
        var geo = budgetBarGeometry(actual, target);
        var delta = actual - target;
        var deltaTxt = Math.abs(delta) < 0.005 ? 'on target'
          : fmtMoney(Math.abs(delta)) + (delta > 0 ? ' over' : ' under');
        if (up && delta >= 0.005) deltaTxt = fmtMoney(delta) + ' ahead';
        if (up && delta <= -0.005) deltaTxt = fmtMoney(Math.abs(delta)) + ' short';

        var notes = [deltaTxt];
        if (basis) notes.push(basis);
        if (b.note) notes.push(b.note);

        return '<div class="card goal-card">' +
          '<div class="row"><span class="name">' + b.name + '</span>' +
          '<span class="amounts">' + fmtMoney(actual) + ' / ' + fmtMoney(target) + '</span></div>' +
          '<div class="bar-track' + (geo.showTick ? ' with-target' : '') + '">' +
            '<div class="bar-fill ' + (missed ? 'bad' : 'good') +
              '" style="width:' + geo.barPct.toFixed(1) + '%"></div>' +
            (geo.showTick ? '<div class="bar-target" style="left:' + geo.targetPct.toFixed(1) + '%"></div>' : '') +
          '</div>' +
          '<div class="goal-note">' + notes.join(' \u00b7 ') + '</div>' +
          '</div>';
      }).join('');
    }

    // Hidden until the data can actually attribute a row to somebody. Every row
    // written before the Card column existed is 'Unassigned', so showing a
