    // Trevon/Ainsley control today would be a control that does nothing.
    function renderPersonFilter() {
      var people = peopleInData();
      var el = $('#personFilter');
      if (!people.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
      el.style.display = '';
      var opts = [{ value: '', label: 'Everyone' }].concat(people.map(function(p) {
        return { value: p, label: p };
      }));
      el.innerHTML = opts.map(function(o) {
        return '<button type="button" data-person="' + attrEscape(o.value) + '"' +
               (o.value === personFilter ? ' class="active"' : '') + '>' + o.label + '</button>';
      }).join('');
    }

    function renderSummary(monthKey) {
      var s = computeMonthSummary(monthKey);
      var netClass = s.netCashFlow < 0 ? 'negative' : 'positive';

      // Deliberately NO hero here. The month selector directly above already says
      // what this screen is about, and on a ledger all six figures matter equally.
      // Giving this the same giant-number treatment as Home is what made the two
      // screens read as duplicates of each other.
      $('#summaryKpiGrid').innerHTML =
        kpiCard('Net cash flow', fmtMoney(s.netCashFlow), netClass) +
        kpiCard('Income', fmtMoney(s.income), 'positive') +
        kpiCard('Total spend', fmtMoney(s.totalSpend), '') +
        kpiCard('Debt paydown', fmtMoney(s.debtPaydown), '') +
        kpiCard('Checking spend', fmtMoney(s.checkingSpend), '') +
        kpiCard('Credit card spend', fmtMoney(s.creditSpend), '');

      $('#summaryDebtCard').innerHTML =
        '<div class="cat-row"><span>Auto loan payment <small style="color:var(--faint)">· debt</small></span>' +
          '<span class="amt">' + fmtMoney(s.autoLoan) + '</span></div>' +
        (s.creditLine ? '<div class="cat-row"><span>Credit line payment <small style="color:var(--faint)">· debt</small></span>' +
          '<span class="amt">' + fmtMoney(s.creditLine) + '</span></div>' : '') +
        '<div class="cat-row"><span>Credit card payment <small style="color:var(--faint)">· transfer, not debt</small></span>' +
          '<span class="amt">' + fmtMoney(s.ccPayments) + '</span></div>' +
        '<div class="cat-row"><span>Internal savings transfer <small style="color:var(--faint)">· transfer</small></span>' +
          '<span class="amt">' + fmtMoney(s.savingsTransfer) + '</span></div>';

      $('#summaryCats').innerHTML = catRows(s.categories);
    }

    function initSummary() {
      var monthKeys = sortedMonthKeys().reverse();
      if (!monthKeys.length) return;
      $('#summaryMonth').innerHTML = monthKeys.map(function(k) {
        return '<option value="' + k + '">' + monthLabel(k) + '</option>';
      }).join('');
      $('#summaryMonth').addEventListener('change', function() {
        renderSummary($('#summaryMonth').value);
      });
      renderSummary(monthKeys[0]);
    }

    ['tf-from', 'tf-to'].forEach(function(id) {
      $('#' + id).addEventListener('change', function() { syncMonthSelect(); applyTxnFilters(); });
    });
    $('#tf-category').addEventListener('change', applyTxnFilters);
    $('#tf-sort').addEventListener('change', applyTxnFilters);
    $('#tf-transfers').addEventListener('change', applyTxnFilters);
    $('#tf-month').addEventListener('change', function() {
      var k = $('#tf-month').value;
      if (k) {
        var r = monthDateRange(k);
        $('#tf-from').value = r.from;
        $('#tf-to').value = r.to;
      } else {
        $('#tf-from').value = ytdStart();
        $('#tf-to').value = '';
      }
      applyTxnFilters();
    });
    $('#tf-clear').addEventListener('click', function() {
      $('#tf-from').value = '';
      $('#tf-to').value = '';
      $('#tf-month').value = '';
      $('#tf-category').value = '';
      $('#tf-sort').value = 'date';
      $('#tf-transfers').checked = false;
      applyTxnFilters();
    });

    loadTransactions();

    loadData();
  }

  // --- Boot ---
  var storedPass = localStorage.getItem(PASS_KEY);
  if (storedPass) {
    tryUnlock(storedPass);
  } else {
    showGate();
  }
</script>
</body>
</html>
